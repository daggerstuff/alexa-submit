name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Gate on tests and lint
        run: |
          pip install -r server/requirements-dev.txt
          ruff check .
          pytest -q

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-2

      - name: Deploy to App Runner
        env:
          DEPLOY_TAG: ${{ github.sha }}
          MCP_API_KEY: ${{ secrets.MCP_API_KEY }}
          INFERENCE_PROVIDER: llm
          INFERENCE_BASE_URL: ${{ secrets.INFERENCE_BASE_URL }}
          INFERENCE_API_KEY: ${{ secrets.INFERENCE_API_KEY }}
          INFERENCE_MODEL: Qwen/Qwen2.5-14B-Instruct
        run: bash scripts/deploy_aws.sh