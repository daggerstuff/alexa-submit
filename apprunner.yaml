# Reference source-configuration file. scripts/deploy_aws.sh is authoritative for
# the live deployment — it builds the source configuration inline and auto-pins
# MCP_ALLOWED_HOSTS to the service URL. Keep this file in sync as a template.
version: 1.0
runtime: docker
build:
  dockerfile: Dockerfile
run:
  command: python -m server.mcp_server
  environment:
    - name: MCP_HOST
      value: 0.0.0.0
    - name: MCP_PORT
      value: 8001
    - name: MCP_PATH
      value: /mcp
    # Must be the exact App Runner service hostname (bare "*" does NOT
    # match — the SDK only accepts exact host or "host:*" patterns).
    # scripts/deploy_aws.sh pins this automatically from the ServiceUrl.
    - name: MCP_ALLOWED_HOSTS
      value: "<service-host>,<service-host>:*"
    - name: MCP_ALLOWED_ORIGINS
      value: http://127.0.0.1:*,http://localhost:*
    - name: MCP_API_KEY
      value: "" # Set a strong secret for public deployments; deploy_aws.sh injects $MCP_API_KEY.
    - name: MCP_RATE_LIMIT_REQUESTS
      value: "60"
    - name: MCP_RATE_LIMIT_WINDOW_SECONDS
      value: "60"
    - name: SESSION_TTL_SECONDS
      value: "1800"
    - name: SESSION_MAX_SESSIONS
      value: "1000"
    # SQLite session store. Survives process restarts within the container;
    # for cross-redeploy persistence mount EFS here via a VPC connector.
    - name: SESSION_DB_PATH
      value: "/tmp/sessions.db"
    - name: INFERENCE_PROVIDER
      value: llm
    - name: INFERENCE_BASE_URL
      value: https://api.featherless.ai/v1
    - name: INFERENCE_MODEL
      value: Qwen/Qwen2.5-14B-Instruct
    - name: INFERENCE_TIMEOUT
      value: "15"
    - name: INFERENCE_API_KEY
      value: "" # deploy_aws.sh injects $INFERENCE_API_KEY.
  port: 8001
