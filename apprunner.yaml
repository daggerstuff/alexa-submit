# Reference source-configuration file. scripts/deploy_aws.sh is authoritative for
# the live deployment — it builds the source configuration inline and auto-pins
# MCP_ALLOWED_HOSTS to the service URL. Keep this file in sync as a template.
version: 1.0
runtime: docker
build:
  dockerfile: Dockerfile
run:
  command: python -m server.mcp_server
  environment:
    - name: MCP_HOST
      value: 0.0.0.0
    - name: MCP_PORT
      value: 8001
    - name: MCP_PATH
      value: /mcp
    # Must be the exact App Runner service hostname (bare "*" does NOT
    # match — the SDK only accepts exact host or "host:*" patterns).
    # scripts/deploy_aws.sh pins this automatically from the ServiceUrl.
    - name: MCP_ALLOWED_HOSTS
      value: "<service-host>,<service-host>:*"
    # Same-origin POST fetches send an Origin header, so the served browser
    # simulator (/simulator) needs the App Runner origin in the allowlist too.
    # scripts/deploy_aws.sh pins this to https://<service-host> automatically.
    - name: MCP_ALLOWED_ORIGINS
      value: "https://<service-host>,http://127.0.0.1:*,http://localhost:*"
    # App Runner terminates TLS at its load balancer and appends the real client
    # IP as the rightmost X-Forwarded-For hop; trust it for rate limiting.
    - name: MCP_TRUST_PROXY
      value: "true"
    - name: MCP_API_KEY
      value: "" # Set a strong secret for public deployments; deploy_aws.sh injects $MCP_API_KEY.
    - name: MCP_RATE_LIMIT_REQUESTS
      value: "60"
    - name: MCP_RATE_LIMIT_WINDOW_SECONDS
      value: "60"
    - name: SESSION_TTL_SECONDS
      value: "1800"
    - name: SESSION_MAX_SESSIONS
      value: "1000"
    # SQLite session store. Survives process restarts within the container;
    # for cross-redeploy persistence mount EFS here via a VPC connector.
    - name: SESSION_DB_PATH
      value: "/tmp/sessions.db"
    - name: INFERENCE_PROVIDER
      value: mock
    - name: INFERENCE_TIMEOUT
      value: "15"
    # Bedrock provider (used when INFERENCE_PROVIDER includes "bedrock"). Requires
    # a Bedrock model/inference-profile ID plus AWS credentials in the task role.
    - name: BEDROCK_MODEL_ID
      value: ""
    # Bedrock Guardrails applied to every Converse turn when set. Pin a numbered
    # version (never DRAFT); keep trace disabled in production.
    - name: BEDROCK_GUARDRAIL_ID
      value: ""
    - name: BEDROCK_GUARDRAIL_VERSION
      value: "1"
    - name: BEDROCK_GUARDRAIL_TRACE
      value: "0"
    - name: AWS_REGION
      value: us-east-1
    # NVIDIA NIM (OpenAI-compatible fallback).
    - name: NIM_BASE_URL
      value: https://integrate.api.nvidia.com/v1
    - name: NIM_API_KEY
      value: "" # deploy_aws.sh injects $NIM_API_KEY.
    - name: NIM_MODEL
      value: ""
    # Cloudflare Workers AI (OpenAI-compatible fallback).
    - name: CLOUDFLARE_BASE_URL
      value: ""
    - name: CLOUDFLARE_API_KEY
      value: "" # deploy_aws.sh injects $CLOUDFLARE_API_KEY.
    - name: CLOUDFLARE_MODEL
      value: ""
  port: 8001
