version: 1.0
runtime: docker
build:
  dockerfile: Dockerfile
run:
  command: python -m server.mcp_server
  environment:
    - name: MCP_HOST
      value: 0.0.0.0
    - name: MCP_PORT
      value: 8001
    - name: MCP_PATH
      value: /mcp
    # Must be the exact App Runner service hostname (bare "*" does NOT
    # match — the SDK only accepts exact host or "host:*" patterns).
    # scripts/deploy_aws.sh pins this automatically from the ServiceUrl.
    - name: MCP_ALLOWED_HOSTS
      value: "<service-host>,<service-host>:*"
    - name: MCP_ALLOWED_ORIGINS
      value: "*"
    - name: INFERENCE_PROVIDER
      value: mock
  port: 8001
